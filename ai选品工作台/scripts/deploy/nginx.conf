# Include inside the existing HTTPS server block.
location = /ai-selection {
    return 302 /ai-selection/mobile-collector;
}

location ^~ /ai-selection/api/workbench/ {
    auth_request /api/access;
    client_max_body_size 16m;
    proxy_pass http://127.0.0.1:18310/api/workbench/;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Workbench-Mobile-Gateway "";
    proxy_read_timeout 120s;
}

location ^~ /ai-selection/api/ {
    default_type application/json;
    return 404 '{"error":"此服务器未配置该工作台接口"}';
}

location ^~ /ai-selection/ {
    auth_request /api/access;
    error_page 401 = @ai_selection_login;
    root /srv/ai-selection/current/web;
    try_files $uri $uri/ /ai-selection/index.html;
}

location @ai_selection_login {
    return 302 /login?next=%2Fai-selection%2Fmobile-collector;
}

location ~ "^/api/mobile/(pair|records|categories|jobs/claim|jobs/[a-f0-9-]{36}/progress)$" {
    limit_except POST { deny all; }
    limit_req zone=chaomai_general burst=40 nodelay;
    client_max_body_size 16m;
    proxy_pass http://127.0.0.1:18310;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Workbench-Mobile-Gateway 1;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 40s;
}
